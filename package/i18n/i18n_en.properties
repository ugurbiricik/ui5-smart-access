# Hover Hints
hint.fontSize=Increases or decreases the text size of the entire page.
hint.textSpacing=Adjusts line, word and letter spacing for better readability.
hint.readingGuide=Shows a reading ruler or mask that follows the mouse pointer.
hint.bigCursor=Enlarges the mouse pointer for better visibility.
hint.highlightLinks=Highlights links and the keyboard focus clearly.
hint.tts=Reads the website or individual content aloud. Use with mouse or keyboard.
hint.colorBlindness=Adjusts colors to compensate for color vision deficiencies (e.g. red-green).
hint.blueLightFilter=Reduces the blue light emitted by the screen.
hint.nightMode=Switches the application to a dark color scheme.
hint.contrastMode=Increases contrast by inverting colors.
hint.stopAnimations=Stops animations and motion on the page.
hint.toggleImages=Hides all images on the page.

