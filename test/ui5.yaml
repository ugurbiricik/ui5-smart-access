specVersion: "4.0"
metadata:
  name: test
type: application
framework:
  name: SAPUI5
  version: "1.136.2"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
# Dev config for `ui5 serve`. The production build lives in ui5-dist.yaml
# (run via `npm run build` / `npm run build:mta`, which pass `--config ui5-dist.yaml`,
# and by `mbt build`). Everything below is resolved live from node_modules, so no
# bundling happens here.
server:
  customMiddleware:
    # TS controllers -> JS on the fly (in-memory), so the browser gets plain JS.
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    # Reload the browser automatically when a source file changes.
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    # Resolves the bare "ui5-smart-access" import live from node_modules AND serves
    # its css/i18n/fragments live -> this is why dev needs no includeAssets.
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression
      configuration:
        debug: true
