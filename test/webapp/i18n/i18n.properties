paragraph1=Dies ist ein längerer Textabschnitt, der verwendet werden kann, um die Text-to-Speech-Funktion, die Schriftgrößenanpassung und den Nachtmodus zu testen. Der Text enthält genügend Inhalte, damit Unterschiede in der Lesbarkeit deutlich sichtbar werden.
paragraph2=Barrierefreiheit ist ein wichtiger Bestandteil moderner Webanwendungen. Mit Funktionen wie Nachtmodus, Blaulichtfilter, Kontrastanpassung und Farbenblindheits-Filtern werden Inhalte für alle Nutzer zugänglich.
paragraph3=Probieren Sie die Funktionen über das Barrierefreiheits-Symbol oben rechts aus. Aktivieren Sie verschiedene Optionen und beobachten Sie, wie sich die Darstellung der Anwendung anpasst.
