linkGithub=Quellcode auf GitHub

# What is it
whatTitle=Was ist ui5-smart-access?
whatP1=ui5-smart-access ist eine schlanke npm-Bibliothek, die einen schwebenden Assistenten in jede SAPUI5-Anwendung einbindet. Über ein Popover passen Endnutzer die Darstellung an ihre Bedürfnisse an – etwa bei Sehschwächen, Lichtempfindlichkeit oder Leseschwierigkeiten.
whatP2=Alle Einstellungen werden lokal gespeichert und beim nächsten Besuch automatisch wiederhergestellt. Die Bibliothek arbeitet rein clientseitig, benötigt kein Backend und sendet keine Nutzerdaten.

# Features
featuresTitle=Funktionen im Überblick
featuresIntro=Acht Werkzeuge für mehr Barrierefreiheit – jede Funktion lässt sich über den Assistenten oben rechts an dieser Seite ausprobieren.

# Why accessibility matters (typography demo)
whyTitle=Warum Barrierefreiheit zählt
whyP1=Rund jeder zehnte Mensch ist auf barrierefreie Software angewiesen – sei es durch eine Seh-, Hör- oder motorische Einschränkung. Barrierefreiheit ist damit kein Zusatz, sondern Grundvoraussetzung für gleichberechtigte Teilhabe.
whyP2=In der EU verpflichtet der European Accessibility Act ab 2025 viele digitale Produkte zur Barrierefreiheit. Standards wie die WCAG 2.1 (Stufe AA) und die EN 301 549 bilden dafür die technische Grundlage.
whyP3=Mit ui5-smart-access geben Sie Ihren Nutzern die Kontrolle über Schriftgröße, Kontrast und Farben zurück. Testen Sie diesen Absatz mit der Vorlese- und der Schriftgrößen-Funktion des Assistenten.
whyLink=WCAG 2.1 Richtlinien öffnen
whyMsgInfo=Tipp: Aktivieren Sie den Nachtmodus, um diese Seite in einem augenschonenden dunklen Design zu sehen.
whyMsgSuccess=Farbschwäche-Filter helfen, Rot-Grün- und Blau-Gelb-Kontraste besser zu unterscheiden.
whyMsgWarning=Niedrige Kontraste erschweren das Lesen – der Kontrastmodus schafft Abhilfe.
whyMsgError=Farbe allein (z. B. nur Rot = Fehler) ist nicht barrierefrei – kombinieren Sie sie mit Text oder Symbolen.

