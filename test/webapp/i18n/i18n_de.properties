# Hero
heroTagline=Der einbettbare Barrierefreiheits-Assistent für SAPUI5-Anwendungen
heroIntro=ui5-smart-access ergänzt jede UI5-App mit einer einzigen Zeile um ein Overlay, über das Nutzer Schrift, Farben, Kontrast, Vorlesefunktion und mehr selbst anpassen – ganz ohne Änderungen am Backend oder an bestehenden Views.
