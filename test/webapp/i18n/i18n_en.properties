# What is it
whatTitle=What is ui5-smart-access?
whatP1=ui5-smart-access is a lightweight npm library that embeds a floating assistant into any SAPUI5 application. Through a popover, end users adapt the display to their needs – for example with visual impairments, light sensitivity or reading difficulties.
whatP2=All settings are stored locally and restored automatically on the next visit. The library runs entirely client-side, requires no backend and sends no user data.

# Features
featuresTitle=Feature Overview
featuresIntro=Eight tools for better accessibility – every feature can be tried out via the assistant in the top-right corner of this page.

# Why accessibility matters (typography demo)
whyTitle=Why accessibility matters
whyP1=Roughly one in ten people depends on accessible software – whether due to a visual, hearing or motor impairment. Accessibility is therefore not an add-on but a prerequisite for equal participation.
whyP2=In the EU, the European Accessibility Act requires many digital products to be accessible from 2025. Standards such as WCAG 2.1 (level AA) and EN 301 549 provide the technical foundation.
whyP3=With ui5-smart-access you give your users back control over font size, contrast and colours. Test this paragraph with the assistant's text-to-speech and font-size features.
whyLink=Open WCAG 2.1 guidelines
whyMsgInfo=Tip: enable night mode to view this page in an eye-friendly dark design.
whyMsgSuccess=Colour-blindness filters help distinguish red-green and blue-yellow contrasts.
whyMsgWarning=Low contrast makes reading harder – contrast mode fixes that.
whyMsgError=Colour alone (e.g. red only = error) is not accessible – combine it with text or icons.

